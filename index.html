<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Willkommen beim ENGAGE E-Learning.">
    <title>ENGAGE E-Learning</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <label class="course-menu" hidden>
      <span class="visually-hidden">Kurs wechseln</span>
      <select id="course-switcher">
        <option value="healthcare">Healthcare</option>
        <option value="social-work">Social Work</option>
      </select>
    </label>
    <main class="welcome">
      <section id="welcome-view">
        <h1>Willkommen beim ENGAGE E-Learning.</h1>
        <fieldset class="course-selection">
          <legend>Wählen Sie Ihren E-Learning-Kurs</legend>
          <div class="course-options">
            <label class="course-option">
              <input type="radio" name="course" value="healthcare">
              <span>Gesundheitswesen</span>
            </label>
            <label class="course-option">
              <input type="radio" name="course" value="social-work">
              <span>Soziale Arbeit</span>
            </label>
          </div>
        </fieldset>
      </section>
      <section class="course-content" data-course-content="healthcare" aria-label="Healthcare introduction" hidden>
        <p>intro</p>
      </section>
      <section class="course-content" data-course-content="social-work" aria-label="Social Work introduction" hidden>
        <p>intro</p>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
