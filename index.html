<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Willkommen beim ENGAGE E-Learning.">
    <title>ENGAGE E-Learning</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <label class="course-menu" hidden>
      <span class="visually-hidden">Kurs wechseln</span>
      <select id="course-switcher">
        <option value="healthcare">Healthcare</option>
        <option value="social-work">Social Work</option>
      </select>
    </label>
    <main class="welcome">
      <section id="welcome-view">
        <h1>Willkommen beim ENGAGE E-Learning.</h1>
        <fieldset class="course-selection">
          <legend>Wählen Sie Ihren E-Learning-Kurs</legend>
          <div class="course-options">
            <label class="course-option">
              <input type="radio" name="course" value="healthcare">
              <span>Gesundheitswesen</span>
            </label>
            <label class="course-option">
              <input type="radio" name="course" value="social-work">
              <span>Soziale Arbeit</span>
            </label>
          </div>
        </fieldset>
      </section>
      <section class="course-content" data-course-content="healthcare" aria-label="Healthcare introduction" hidden>
        <p>intro</p>
      </section>
      <section class="course-content social-work-course" data-course-content="social-work" aria-labelledby="social-work-title" hidden>
        <h1 id="social-work-title">ENGAGE e-learning</h1>
        <div class="course-tabs" role="tablist" aria-label="Social Work course sections">
          <button class="course-tab" id="social-work-tab-introduction" type="button" role="tab" aria-selected="true" aria-controls="social-work-panel-introduction" tabindex="0">Introduction</button>
          <button class="course-tab" id="social-work-tab-module-1" type="button" role="tab" aria-selected="false" aria-controls="social-work-panel-module-1" tabindex="-1">Modul 1</button>
          <button class="course-tab" id="social-work-tab-module-2" type="button" role="tab" aria-selected="false" aria-controls="social-work-panel-module-2" tabindex="-1">Modul 2</button>
          <button class="course-tab" id="social-work-tab-module-3" type="button" role="tab" aria-selected="false" aria-controls="social-work-panel-module-3" tabindex="-1">Modul 3</button>
          <button class="course-tab" id="social-work-tab-module-4" type="button" role="tab" aria-selected="false" aria-controls="social-work-panel-module-4" tabindex="-1">Modul 4</button>
          <button class="course-tab" id="social-work-tab-module-5" type="button" role="tab" aria-selected="false" aria-controls="social-work-panel-module-5" tabindex="-1">Modul 5</button>
          <button class="course-tab" id="social-work-tab-module-6" type="button" role="tab" aria-selected="false" aria-controls="social-work-panel-module-6" tabindex="-1">Modul 6</button>
        </div>
        <section class="course-tab-panel" id="social-work-panel-introduction" role="tabpanel" aria-labelledby="social-work-tab-introduction" tabindex="0"></section>
        <section class="course-tab-panel" id="social-work-panel-module-1" role="tabpanel" aria-labelledby="social-work-tab-module-1" tabindex="0" hidden></section>
        <section class="course-tab-panel" id="social-work-panel-module-2" role="tabpanel" aria-labelledby="social-work-tab-module-2" tabindex="0" hidden></section>
        <section class="course-tab-panel" id="social-work-panel-module-3" role="tabpanel" aria-labelledby="social-work-tab-module-3" tabindex="0" hidden></section>
        <section class="course-tab-panel" id="social-work-panel-module-4" role="tabpanel" aria-labelledby="social-work-tab-module-4" tabindex="0" hidden></section>
        <section class="course-tab-panel" id="social-work-panel-module-5" role="tabpanel" aria-labelledby="social-work-tab-module-5" tabindex="0" hidden></section>
        <section class="course-tab-panel" id="social-work-panel-module-6" role="tabpanel" aria-labelledby="social-work-tab-module-6" tabindex="0" hidden></section>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
