<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Willkommen beim ENGAGE E-Learning.">
    <title>ENGAGE E-Learning</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="welcome">
      <h1>Willkommen beim ENGAGE E-Learning.</h1>
      <fieldset class="course-selection">
        <legend>Wählen Sie Ihren E-Learning-Kurs</legend>
        <div class="course-options">
          <label class="course-option">
            <input type="radio" name="course" value="healthcare">
            <span>Gesundheitswesen</span>
          </label>
          <label class="course-option">
            <input type="radio" name="course" value="social-work">
            <span>Soziale Arbeit</span>
          </label>
        </div>
      </fieldset>
      <section class="course-content" id="healthcare-content" data-course-content="healthcare" aria-labelledby="healthcare-heading" hidden>
        <h2 id="healthcare-heading">Gesundheitswesen</h2>
        <!-- Add the Gesundheitswesen course content here. -->
      </section>
      <section class="course-content" id="social-work-content" data-course-content="social-work" aria-labelledby="social-work-heading" hidden>
        <h2 id="social-work-heading">Soziale Arbeit</h2>
        <!-- Add the Soziale Arbeit course content here. -->
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
